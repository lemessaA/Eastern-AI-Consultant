[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# Use DATABASE_URL from environment (set via env var or .env file)
# This is overridden in alembic/env.py from app.core.config.settings.DATABASE_URL
sqlalchemy.url = postgresql+psycopg2://user:pass@localhost/db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
